<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exame de Compreensão Auditiva</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none; /* Impede selecionar texto */
        }
        .card {
            text-align: center;
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 800px;
            width: 90%;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 24px;
        }
        .media-wrapper {
            position: relative;
            width: 100%;
            margin-top: 20px;
            border-radius: 8px;
            overflow: hidden;
        }
        /* Película invisível por cima do vídeo que bloqueia todos os cliques */
        .overlay-blocker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            background: transparent;
            cursor: default;
        }
        video {
            width: 100%;
            min-height: 250px;
            max-height: 400px;
            display: block;
            outline: none;
        }
        .btn-start {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-start:hover {
            background-color: #1d4ed8;
        }
        .status {
            margin-top: 15px;
            font-size: 15px;
            color: #94a3b8;
        }
    </style>
</head>
<body oncontextmenu="return false;"> <!-- Bloqueia botão direito -->

    <div class="card">
        <h1 id="tituloProva">Exame de Compreensão Auditiva - CILPINHO A1</h1>

        <button id="startBtn" class="btn-start" onclick="iniciarProva()">Iniciar Prova</button>

        <div id="mediaContainer" style="display: none;">
            <div class="media-wrapper">
                <!-- Camada invisível de bloqueio -->
                <div class="overlay-blocker"></div>
                
                <video id="playerMidia" preload="auto">
                    <source src="neymar.mp4" type="video/mp4">
                    O seu navegador não suporta este formato de mídia.
                </video>
            </div>
            <p class="status" id="statusTxt">A mídia está em execução. Não é possível pausar nem voltar.</p>
        </div>
    </div>

    <script>
        const player = document.getElementById('playerMidia');
        const startBtn = document.getElementById('startBtn');
        const mediaContainer = document.getElementById('mediaContainer');
        const statusTxt = document.getElementById('statusTxt');

        function iniciarProva() {
            startBtn.style.display = 'none';
            mediaContainer.style.display = 'block';

            player.load();
            player.play().catch(error => {
                alert("Erro ao carregar a mídia. Verifique com o aplicador.");
                startBtn.style.display = 'inline-block';
            });
        }

        // TRAVA 1: Se por qualquer motivo o vídeo for pausado antes do fim, força a reprodução imediata
        player.addEventListener('pause', function() {
            if (!player.ended) {
                player.play();
            }
        });

        // TRAVA 2: Bloqueia todas as teclas de atalho de controlo de mídia no teclado
        window.addEventListener('keydown', function(event) {
            const teclasBloqueadas = [
                'Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown',
                'KeyK', 'KeyJ', 'KeyL', 'Tab', 'MediaPlayPause', 'MediaTrackNext', 'MediaTrackPrevious'
            ];
            if (teclasBloqueadas.includes(event.code) || event.keyCode === 32) {
                event.preventDefault();
                event.stopPropagation();
                return false;
            }
        }, true);

        // Mensagem ao concluir
        player.onended = function() {
            statusTxt.textContent = "A reprodução foi concluída. Aguarde as orientações do aplicador.";
            statusTxt.style.color = "#4ade80";
        };
    </script>
</body>
</html>
